  <text data-role="node-text" x="380" y="516" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Windows</text>
  <text data-role="node-text" x="380" y="533" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Proxy · login</text>
  <text data-role="node-text" x="606" y="516" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Core</text>
  <text data-role="node-text" x="606" y="533" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Network engine</text>
  <text data-role="arrow-label" x="388" y="152" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">Requests</text>
  <text data-role="arrow-label" x="304" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Changes</text>
  <text data-role="arrow-label" x="493" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Core API</text>
  <text data-role="arrow-label" x="614" y="440" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">HTTP / WS</text>
  <rect x="40" y="590" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="legend-label" x="58" y="596" dominant-baseline="central" font-size="12" fill="#3D3D3A">Serialized changes</text>
  <rect x="205" y="590" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
