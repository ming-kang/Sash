<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img">
  <title>Sash dashboard architecture</title>
  <desc>Views send user intent to actions and the shared authenticated API client. Responses, status events, resource queries and telemetry update shared state, which renders the views. All browser traffic reaches Sash through the same local API.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#FFFFFF"/>
  <rect data-role="container" x="40" y="40" width="680" height="408" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text data-role="container-label" x="60" y="66" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Dashboard · web/src/</text>
  <line x1="196" y1="160" x2="196" y2="232" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M196 288 L196 328 L380 328 L380 360" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M462 388 L564 388 L564 288" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="564" y1="232" x2="564" y2="160" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="496" y1="132" x2="276" y2="132" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="416" x2="380" y2="496" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="116" y="104" width="160" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="496" y="104" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="94" y="232" width="204" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="462" y="232" width="204" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="298" y="360" width="164" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="292" y="496" width="176" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text data-role="node-text" x="196" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Views &amp; controls</text>
  <text data-role="node-text" x="196" y="141" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">App.vue · views/</text>
  <text data-role="node-text" x="564" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Shared state</text>
  <text data-role="node-text" x="564" y="141" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">stores/state.ts</text>
  <text data-role="node-text" x="196" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Actions</text>
  <text data-role="node-text" x="196" y="269" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Runtime · profiles · Core</text>
  <text data-role="node-text" x="564" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Refresh &amp; streams</text>
  <text data-role="node-text" x="564" y="269" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">SSE · queries · telemetry</text>
  <text data-role="node-text" x="380" y="380" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">API &amp; session</text>
  <text data-role="node-text" x="380" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Typed client · api/</text>
  <text data-role="node-text" x="380" y="516" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Sash local API</text>
  <text data-role="node-text" x="380" y="533" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">/sash/* · /core/api/*</text>
  <text data-role="arrow-label" x="204" y="196" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">Intent</text>
  <text data-role="arrow-label" x="288" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Requests</text>
  <text data-role="arrow-label" x="513" y="380" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Data</text>
  <text data-role="arrow-label" x="572" y="196" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">Update</text>
  <text data-role="arrow-label" x="386" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Render</text>
  <text data-role="arrow-label" x="388" y="456" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">HTTP · SSE · WS</text>
  <rect x="40" y="590" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text data-role="legend-label" x="58" y="596" dominant-baseline="central" font-size="12" fill="#3D3D3A">Actions and transport</text>
  <rect x="226" y="590" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="legend-label" x="244" y="596" dominant-baseline="central" font-size="12" fill="#3D3D3A">Data and rendering</text>
</svg>
