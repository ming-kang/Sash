<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before Vue and styles render.
      (function () {
        var preference = "system";
        try {
          var saved = localStorage.getItem("sash.theme");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch (_) {
          // Storage can be unavailable in restricted browsing contexts.
        }
        var resolved =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <title>Sash</title>
    <meta name="description" content="Sash local network console" />
    <link rel="icon" type="image/png" href="./assets/branding/sash-cat.png" />
    <script>
      // Clear legacy Service Workers and caches left by prior third-party dashboards.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) reg.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) caches.delete(name);
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
