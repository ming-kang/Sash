<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sash</title>
    <meta name="description" content="Sash local network console" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M20.6 11.2c-.7-1.9-2.6-3-4.9-3-2.9 0-5 1.7-5 4 0 5.3 10.4 2.9 10.4 7.9 0 2.5-2.3 4.1-5.3 4.1-2.7 0-4.9-1.3-5.5-3.4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Clear legacy Service Workers and caches left by prior third-party dashboards.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) reg.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) caches.delete(name);
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
