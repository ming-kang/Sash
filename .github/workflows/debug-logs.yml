name: Debug logs.test.ts (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full suite, default concurrency
        continue-on-error: true
        run: node scripts/run-tests.mjs
      - name: Full suite, serialized
        if: always()
        continue-on-error: true
        shell: bash
        run: node --import tsx --test --test-concurrency=1 $(find src web/src -name '*.test.ts' | sort | tr '\n' ' ')
      - name: Full suite, concurrency 2
        if: always()
        continue-on-error: true
        shell: bash
        run: node --import tsx --test --test-concurrency=2 $(find src web/src -name '*.test.ts' | sort | tr '\n' ' ')
