name: Debug logs.test.ts (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Whole file
        id: whole
        continue-on-error: true
        run: node --import tsx --test src/logs.test.ts
      - name: Growth suite only
        if: always()
        continue-on-error: true
        run: node --import tsx --test "--test-name-pattern=log file growth" src/logs.test.ts
      - name: Follow suite only
        if: always()
        continue-on-error: true
        run: node --import tsx --test "--test-name-pattern=followLogFile" src/logs.test.ts
      - name: Signal suite only
        if: always()
        continue-on-error: true
        run: node --import tsx --test "--test-name-pattern=signal listeners" src/logs.test.ts
      - name: Whole file again, serialized
        if: always()
        continue-on-error: true
        run: node --import tsx --test --test-concurrency=1 src/logs.test.ts
