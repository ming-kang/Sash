name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check source and build the npm package
    # The package embeds the SHA-256 digests of the exact helper executables
    # the GitHub Release will carry, so packing waits for the helper artifact.
    needs: tun-helper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:prod
      - name: Download the TUN helper the release will carry
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tun-helper
          path: ${{ runner.temp }}/tun-helper
      - name: Build and pack once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node node_modules/cn-font-split/dist/cli.js i default@7.6.8
          npm run build:release
          node scripts/build-helper-digests.mjs "$RUNNER_TEMP/tun-helper"
          mkdir -p "$RUNNER_TEMP/sash-package"
          npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/sash-package"
      - name: Save the package for testing and publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/sash-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: ${{ matrix.os }} / Node 24
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/sash-package
      - name: Install and exercise the shared package
        env:
          SASH_PACKAGE_SMOKE_REQUIRE_BOOTSTRAP: "1"
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/package-smoke.mjs "$RUNNER_TEMP/sash-package/astralyn-sash-$version.tgz"

  tun-helper:
    name: Windows TUN helper
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: helper/go.sum
      - name: Test the helper
        working-directory: helper
        run: |
          go vet ./...
          go test ./...
      - name: Build the release binaries
        run: |
          node scripts/build-helper.mjs --out "$RUNNER_TEMP/tun-helper"
          version="$(node -p "require('./package.json').version")"
          test "$("$RUNNER_TEMP/tun-helper/sash-tun-helper-win32-x64.exe" --version)" = "$version"
      - name: Save the helper for the GitHub Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tun-helper
          path: ${{ runner.temp }}/tun-helper/*.exe
          if-no-files-found: error
          retention-days: 14
