name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check source and build the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: helper/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:prod
      - name: Build and pack once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node node_modules/cn-font-split/dist/cli.js i default@7.6.8
          npm run build:release
          mkdir -p "$RUNNER_TEMP/sash-package"
          npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/sash-package"
      - name: Save the package for testing and publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/sash-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: ${{ matrix.os }} / Node 24
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/sash-package
      - name: Install and exercise the shared package
        env:
          SASH_PACKAGE_SMOKE_REQUIRE_BOOTSTRAP: "1"
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/package-smoke.mjs "$RUNNER_TEMP/sash-package/astralyn-sash-$version.tgz"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: helper/go.sum
      - name: Check Go helper
        working-directory: helper
        run: |
          go test ./...
          go vet ./...
      - name: Build and smoke-test the Go helper
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            npm run build:helper -- --all
          else
            npm run build:helper
          fi
          helper="$(node --input-type=module -e "import { helperFilename } from './scripts/helper-artifacts.mjs'; console.log(helperFilename(process.platform, process.arch))")"
          version="$(node -p "require('./package.json').version")"
          test "$("./dist/$helper" --version)" = "$version"
      - name: Verify the unchanged TS IPC client against Go
        run: |
          binary="$(node -p "require('node:path').resolve('dist', 'go-helper-contract' + (process.platform === 'win32' ? '.exe' : ''))")"
          CGO_ENABLED=0 go -C helper build -tags helpercontract -o "$binary" .
          SASH_GO_CONTRACT_BINARY="$binary" npx vitest run src/launcher/ipc-go.test.ts
