name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish @astralyn/sash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      release_sha: ${{ steps.provenance.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0 --ignore-scripts

      - name: Verify release request
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release workflow must run from main (got $GITHUB_REF)." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (!version || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Expected a stable numeric version such as 0.1.1, got ${version ?? "nothing"}.`);
          }

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const changelog = readFileSync("CHANGELOG.md", "utf8");

          if (packageJson.name !== "@astralyn/sash") {
            throw new Error(`Expected the root package to be @astralyn/sash, got ${packageJson.name}.`);
          }
          if (
            packageJson.version !== version ||
            packageLock.version !== version ||
            packageLock.packages?.[""]?.version !== version
          ) {
            throw new Error(
              `Release input ${version} must match package.json (${packageJson.version}) and package-lock.json (${packageLock.version}).`,
            );
          }
          const releaseHeading = `## [${version}] - `;
          const headingCount = changelog
            .split("\n")
            .filter((line) => line.startsWith(releaseHeading)).length;
          if (headingCount !== 1) {
            throw new Error(
              `Expected exactly one CHANGELOG.md release heading for ${version}, found ${headingCount}.`,
            );
          }
          NODE

          if npm view "@astralyn/sash@$RELEASE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@astralyn/sash@$RELEASE_VERSION is already published; resuming verification against its published provenance."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/cn-font-split/dist/cli.js i default@7.6.8

      - name: Verify source
        run: |
          npm run audit:prod
          npm run lint
          npm test
          npm run build

      - name: Pack npm artifact
        id: pack
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/sash-package"
          tarball="$package_dir/astralyn-sash-$RELEASE_VERSION.tgz"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts --silent --pack-destination "$package_dir" >/dev/null
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify packed package installation
        run: node scripts/package-smoke.mjs "${{ steps.pack.outputs.tarball }}"

      - name: Publish verified artifact
        if: steps.release.outputs.already_published != 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --registry=https://registry.npmjs.org

      - name: Wait for registry metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            published="$(npm view "@astralyn/sash@$RELEASE_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$RELEASE_VERSION" ]; then
              echo "Verified @astralyn/sash@$RELEASE_VERSION metadata on npm."
              exit 0
            fi
            sleep 10
          done
          echo "Published version was not visible on npm after two minutes." >&2
          echo "If this release was staged, approve it on npmjs.com and dispatch this workflow again." >&2
          exit 1

      - name: Verify registry provenance
        id: provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.already_published }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const packageName = "@astralyn/sash";
          const encodedPackageName = encodeURIComponent(packageName);
          const url = `https://registry.npmjs.org/-/npm/v1/attestations/${encodedPackageName}@${process.env.RELEASE_VERSION}`;
          let body;
          for (let attempt = 1; ; attempt++) {
            const response = await fetch(url);
            if (response.ok) {
              body = await response.json();
              break;
            }
            if (attempt >= 6) {
              throw new Error(`Failed to load npm attestations: ${response.status} ${response.statusText}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          const provenance = body.attestations?.find(
            (attestation) => attestation.predicateType === "https://slsa.dev/provenance/v1",
          );
          if (!provenance) {
            throw new Error("Published package has no SLSA provenance attestation.");
          }
          const statement = JSON.parse(
            Buffer.from(provenance.bundle.dsseEnvelope.payload, "base64url").toString("utf8"),
          );
          const source = statement.predicate?.buildDefinition?.resolvedDependencies?.find(
            (dependency) => dependency.uri === "git+https://github.com/ming-kang/Sash@refs/heads/main",
          );
          const publishedCommit = source?.digest?.gitCommit;
          if (!/^[0-9a-f]{40}$/.test(publishedCommit ?? "")) {
            throw new Error("Published provenance does not identify a source commit on main.");
          }
          if (process.env.ALREADY_PUBLISHED !== "true" && publishedCommit !== process.env.GITHUB_SHA) {
            throw new Error(
              `Published provenance identifies commit ${publishedCommit}, not ${process.env.GITHUB_SHA}.`,
            );
          }
          console.log(`Published provenance identifies commit ${publishedCommit}.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release_sha=${publishedCommit}\n`);
          NODE

      - name: Verify registry installation
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 6); do
            if node scripts/package-smoke.mjs "@astralyn/sash@$RELEASE_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Registry installation attempt $attempt failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "Published package could not be installed and smoke-tested from npm." >&2
          exit 1

  runtime-smoke:
    name: Verify registry runtime on Windows
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and run the published package with a real Core
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/registry-runtime-smoke.mjs "${{ inputs.version }}"

  release:
    name: Tag and create the GitHub Release
    needs: [publish, runtime-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the release commit is on main
        run: |
          test -n "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/main"

      - name: Extract release notes from CHANGELOG.md
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          const version = process.env.RELEASE_VERSION;
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const start = lines.findIndex((line) => line.startsWith(`## [${version}] - `));
          if (start === -1) {
            throw new Error(`CHANGELOG.md has no release heading for ${version}.`);
          }
          let end = lines.length;
          for (let i = start + 1; i < lines.length; i++) {
            if (lines[i].startsWith("## ")) {
              end = i;
              break;
            }
          }
          const notes = lines.slice(start + 1, end).join("\n").trim();
          if (!notes) {
            throw new Error(`CHANGELOG.md section for ${version} is empty.`);
          }
          writeFileSync(path.join(process.env.RUNNER_TEMP, "release-notes.md"), `${notes}\n`);
          NODE

      - name: Tag the release commit
        run: |
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            existing="$(git rev-parse "v$RELEASE_VERSION^{commit}")"
            if [ "$existing" != "$RELEASE_SHA" ]; then
              echo "Tag v$RELEASE_VERSION already exists at $existing, not the release commit $RELEASE_SHA." >&2
              exit 1
            fi
            echo "Tag v$RELEASE_VERSION already exists at the release commit."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "v$RELEASE_VERSION" "$RELEASE_SHA" -m "release: $RELEASE_VERSION"
            git push origin "v$RELEASE_VERSION"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v$RELEASE_VERSION already exists."
          else
            gh release create "v$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sash $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
