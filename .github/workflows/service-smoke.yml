name: Disposable Windows service acceptance

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Type I_ACKNOWLEDGE_DISPOSABLE_WINDOWS_VM_SERVICE_TEST (installs service and runs real Core, never TUN)'
        required: true
        type: string
      coreVersion:
        description: 'Optional strict stable vX.Y.Z Core tag; empty selects verified latest upstream release'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: service-vm-smoke
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'ming-kang/Sash' && inputs.acknowledgement == 'I_ACKNOWLEDGE_DISPOSABLE_WINDOWS_VM_SERVICE_TEST'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SASH_VM_ACK: ${{ inputs.acknowledgement }}
      SASH_VM_CORE_VERSION: ${{ inputs.coreVersion }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse invalid input and non-hosted execution before builds
        run: node --input-type=module -e "import {guard} from './scripts/service-vm-smoke.mjs'; guard([],process.env,process.platform)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: service/go.sum
      - name: Build package and native test tools (no publishing)
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/cn-font-split/dist/cli.js i default@7.6.8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:service-vm-guard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm pack --dry-run --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:service -- --arch amd64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location service
          try {
            go build -mod=readonly -trimpath -buildvcs=false -o ../.native/service-vm-runner.exe ../scripts/service-vm-runner_windows.go
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Acknowledged disposable VM acceptance only
        run: node --import tsx scripts/service-vm-smoke.mjs
      # Deliberately no artifact/log upload, secrets, release or publish step.
      # The harness owns cleanup; workflow cancellation relies on VM disposal,
      # never an unconditional administrative uninstall against unknown state.
